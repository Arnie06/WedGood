name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
        env:
          # Public, non-secret value; production builds fail fast without it.
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      # Real local Supabase stack (Docker); migrations apply from supabase/migrations.
      - run: pnpm db:start
      - run: pnpm test:integration
      - if: ${{ !cancelled() }}
        run: pnpm db:stop

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      # Real local stack so the auth/membership specs run instead of skipping.
      # The Docker network occasionally fails to bind a port on a runner; one retry clears it.
      - run: pnpm db:start || (pnpm db:stop; sleep 5; pnpm db:start)
      # Fresh reset + seed proves migrations and the seed script work from scratch.
      - run: pnpm db:fresh
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Builds and serves the app itself (playwright.config.ts webServer).
      - run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        run: pnpm db:stop
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
